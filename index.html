<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Lost &amp; Found</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mute:#667085;--line:#e1e4e8;--acc:#0b6bcb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171d24;--ink:#e8ecf1;--mute:#98a2b3;--line:#2a323c;--acc:#5aa9ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 14px}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:14px}
input:focus-visible{outline:2px solid var(--acc)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line);cursor:zoom-in}
.card div{padding:10px 12px}
.card h3{margin:0 0 4px;font-size:1rem}
.card p{margin:0;color:var(--mute);font-size:.9rem;word-break:break-word}
.card small{color:var(--mute);display:block;margin-top:6px}
#msg{color:var(--mute)}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>School Lost &amp; Found</h1>
<p class="sub">Found something that looks like yours? Visit the office and describe it to claim it.</p>
<input id="q" type="search" placeholder="Search items (e.g. umbrella, bottle, blue)" aria-label="Search items">
<p id="msg">Loading...</p>
<div id="grid"></div>
</main>
<div id="zoom"><img alt=""></div>

<script>
// Auto-detects owner/repo when hosted on GitHub Pages (owner.github.io/repo/).
// Otherwise fill these in by hand.
let OWNER = '', REPO = '';
const BRANCH = 'data', FILE = 'data/items.json';

if (!OWNER && location.hostname.endsWith('.github.io')){
  OWNER = location.hostname.split('.')[0];
  REPO = location.pathname.split('/')[1];
}
const URL_JSON = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${FILE}`;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let items = [];

function render(){
  const q = $('q').value.trim().toLowerCase();
  const list = items.filter(i => !q || (i.title + ' ' + (i.note || '')).toLowerCase().includes(q));
  $('msg').textContent = list.length ? '' : (items.length ? 'No matches.' : 'No items posted yet.');
  $('grid').innerHTML = list.map(i => `
    <div class="card">
      ${i.image ? `<img src="${esc(i.image)}" alt="${esc(i.title)}" loading="lazy">` : ''}
      <div>
        <h3>${esc(i.title)}</h3>
        <p>${esc(i.note)}</p>
        <small>Posted ${new Date(i.created || i.updated).toLocaleDateString()}</small>
      </div>
    </div>`).join('');
}

async function init(){
  try{
    // Cached copy is used first, so this stays fast and light.
    const r = await fetch(URL_JSON);
    if (!r.ok) throw new Error(r.status);
    items = await r.json();
    render();
  }catch(e){ $('msg').textContent = 'Could not load items. Please try again later.'; }
}

$('q').addEventListener('input', render);
$('grid').addEventListener('click', e => {
  if (e.target.tagName === 'IMG'){ $('zoom').firstElementChild.src = e.target.src; $('zoom').style.display = 'flex'; }
});
$('zoom').onclick = () => $('zoom').style.display = 'none';
init();
</script>
</body>
</html>
